<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050507">
  <title>Muaaz Din Ahmad — Cinematic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <div class="grain"></div>
    <div class="vignette"></div>

    <section class="hero" aria-label="Muaaz Din Ahmad">
      <div class="image-wrap">
        <img src="hero.png" alt="Muaaz Din Ahmad standing on a rooftop">
        <div class="hair-wind wind-1"></div>
        <div class="hair-wind wind-2"></div>
        <div class="hair-wind wind-3"></div>
        <div class="blink"></div>
      </div>

      <div class="name">
        <span class="eyebrow">CINEMATIC PORTRAIT</span>
        <h1>MOAAZUDDIN<br><em>AHMAD</em></h1>
        <span class="line"></span>
      </div>

      <div class="scroll">SCROLL TO EXPLORE <span>↓</span></div>
    </section>

    <section class="about">
      <p class="tag">THE MOMENT</p>
      <h2>Stillness, with a little motion.</h2>
      <p class="copy">
        A cinematic portrait experience built around a quiet rooftop moment,
        subtle wind movement and natural blinking.
      </p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
